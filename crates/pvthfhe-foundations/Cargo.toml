[package]
name = "pvthfhe-foundations"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
rand = "0.8"
rand_core = "0.6"
zeroize = { version = "1", features = ["zeroize_derive"] }
serde = { version = "1", features = ["derive"] }
syn = { version = "2", features = ["full", "parsing", "visit"] }
walkdir = "2"
light-poseidon = "0.4"
ark-bn254 = "0.5"
ark-ff = "0.5"

[dev-dependencies]
quote = "1"
proptest = "1"
