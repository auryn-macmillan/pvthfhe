[package]
name = "pvthfhe-rings"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Per-channel cyclotomic ring types for native LatticeFold+ folding over RNS primes"

[dependencies]
# Same fhe-math dependency as pvthfhe-cyclo — provides NTT-accelerated ring arithmetic
# for arbitrary ring degree and modulus via Context::new(&[q], N).
fhe-math = { package = "fhe-math", git = "https://github.com/gnosisguild/fhe.rs", rev = "5f24d0b62a7329b789db07a065b68accd614a47b" }
ark-ff = "0.5"
ark-bn254 = "0.5"
num-bigint = { version = "0.4", features = ["rand"] }
num-traits = "0.2"
rand = "0.8"
rand_chacha = "0.3"
rand_core = "0.6"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
ark-std = "0.5"

[features]
default = []
# Use N=256 ring degree for fast-test iteration (default is N=8192).
fast-ring-n256 = []
